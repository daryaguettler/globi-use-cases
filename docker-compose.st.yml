services:
  visualizer:
    build:
      context: .
      dockerfile: docker/visualizer/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
    env_file:
      - .env
    ports:
      - "${PORT:-8502}:8502"
    volumes:
      - ./outputs:/code/outputs
      - ./src:/code/src
      - ./data:/code/data
